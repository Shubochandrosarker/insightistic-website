  <title id="title">Illustrative Insightistic AI workspace</title>
  <desc id="desc">A demo AI workspace with seven focused specialist cards and a copilot prompt.</desc>
  <rect width="1269" height="971" fill="#f7fafb"/><text x="74" y="52" fill="#111c22" font-family="Arial,sans-serif" font-size="27" font-weight="700">AI workspace</text><text x="74" y="78" fill="#718188" font-family="Arial,sans-serif" font-size="14">Illustrative workspace · connected demo context</text><rect x="74" y="112" width="1120" height="144" rx="18" fill="#101820"/><text x="98" y="146" fill="#04d2c0" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ANALYZE YOUR DATA WITH AI</text><text x="98" y="184" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Ask one focused question.</text><text x="98" y="211" fill="#c4d2d7" font-family="Arial,sans-serif" font-size="14">Use connected site context and a selected date range.</text><rect x="720" y="171" width="330" height="44" rx="12" fill="#26343b" stroke="#4b5b60"/><text x="740" y="198" fill="#9aaeb4" font-family="Arial,sans-serif" font-size="13">What should we analyze?</text><rect x="1060" y="171" width="106" height="44" rx="12" fill="#04d2c0"/><text x="1081" y="198" fill="#06202c" font-family="Arial,sans-serif" font-size="13" font-weight="700">Analyze</text><text x="74" y="306" fill="#718188" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">AGENT LIBRARY</text><text x="74" y="336" fill="#111c22" font-family="Arial,sans-serif" font-size="20" font-weight="700">Choose a specialist</text><g transform="translate(74 366)" fill="#fff" stroke="#dbe5e8"><rect width="340" height="150" rx="16"/><rect x="370" width="340" height="150" rx="16"/><rect x="740" width="340" height="150" rx="16"/><rect y="174" width="340" height="150" rx="16"/><rect x="370" y="174" width="340" height="150" rx="16"/><rect x="740" y="174" width="340" height="150" rx="16"/><rect y="348" width="340" height="150" rx="16"/></g><g font-family="Arial,sans-serif"><g fill="#111c22" font-size="17" font-weight="700"><text x="100" y="408">SEO analyst</text><text x="470" y="408">Search analyst</text><text x="840" y="408">Keyword analyst</text><text x="100" y="582">Article analyst</text><text x="470" y="582">Site audit analyst</text><text x="840" y="582">Growth analyst</text><text x="100" y="756">Knowledge curator</text></g><g fill="#718188" font-size="13"><text x="100" y="437">Turn crawl findings into a prioritized plan.</text><text x="470" y="437">Explain search movement in context.</text><text x="840" y="437">Find themes, gaps and next targets.</text><text x="100" y="611">Review content quality and coverage.</text><text x="470" y="611">Translate issues into clear fixes.</text><text x="840" y="611">Connect signals into growth actions.</text><text x="100" y="785">Keep sources useful and current.</text></g><g fill="#04bfae" font-size="12" font-weight="700"><text x="100" y="485">Open workspace →</text><text x="470" y="485">Open workspace →</text><text x="840" y="485">Open workspace →</text><text x="100" y="659">Open workspace →</text><text x="470" y="659">Open workspace →</text><text x="840" y="659">Open workspace →</text><text x="100" y="833">Open workspace →</text></g></g>
